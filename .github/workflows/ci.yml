name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check apps config

      - name: Tests (fast, no Manim/Docker)
        run: pytest -m "not slow" --cov=apps --cov-report=term-missing --cov-fail-under=60

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

  slow:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Slow tests (real Manim render)
        run: pytest -m slow
