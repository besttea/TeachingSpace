[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle errors + pyflakes
ignore = [
    "E501",  # line length handled by formatters, not lint
    "W293",  # trailing whitespace inside docstrings is cosmetic
    "E402",  # lazy in-function imports are an intentional pattern here
]

[tool.ruff.lint.per-file-ignores]
# Django settings use `from .base import *` by convention
"config/settings/*" = ["F403", "F405"]

[tool.coverage.run]
# sandbox_runner.py executes as a `python -I` subprocess (no coverage
# tracing inside the child); its behavior is exercised indirectly by every
# CodeExecutor integration test. Excluded from line coverage (6.5).
omit = ["*/sandbox_runner.py"]

[tool.coverage.report]
show_missing = true
