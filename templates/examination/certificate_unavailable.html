{% extends 'base.html' %}

{% block title %}证书不可用 - Python Learning{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-emoji-frown" style="font-size: 4rem; color: #e67e22;"></i>
            <h3 class="mt-3">暂未获得证书</h3>
            <p class="text-muted">
                本次考试得分 <strong>{{ student_exam.score }}</strong> 分，
                未达到通过分数线（{{ student_exam.exam.passing_score }} 分）。
                继续加油，下次一定行！
            </p>
            <a href="{% url 'examination:exam-detail' student_exam.exam.id %}" class="btn btn-primary">
                <i class="bi bi-arrow-left"></i> 返回考试详情
            </a>
        </div>
    </div>
</div>
{% endblock %}
